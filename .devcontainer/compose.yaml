services:
  dev:
    image: ghcr.io/miguelrodo/devcontainers-main:v1.12.1
    volumes:
      - ..:/workspaces/upskilling
    command: sleep infinity
    depends_on:
      - db

  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: student
      POSTGRES_PASSWORD: training_password
      POSTGRES_DB: clinical_training
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: