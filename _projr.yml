directories:
  raw-docs:
    path: _reference
  raw-data:
    path: _raw_data
    source:
      github: archive
  cache:
    path: _tmp
  output:
    path: _output
  docs:
    path: docs
  data:
    path: data
build:
  scripts:
  - 01-data-prep.qmd
  - 02-primary-analysis.qmd
  - 04-clinical-summary.qmd
  github:
    archive:
      content:
      - raw-data
      - output
      - raw-docs
      - docs
      structure: archive
      send_cue: always
      send_strategy: upload-all

